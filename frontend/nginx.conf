server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API + health go to the backend service (same name in Compose and Kubernetes)
  location /api/  { proxy_pass http://backend:3000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://backend:3000; }

  location / { try_files $uri /index.html; }
}
