# Used on the server provisioned by Terraform. Images are built & pushed by GitHub Actions.
# IMAGE_PREFIX and TAG come from the .env file next to this file.
services:
  backend:
    image: ${IMAGE_PREFIX}-backend:${TAG:-latest}
    volumes:
      - task-data:/app/data
    restart: always

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: always

volumes:
  task-data:
  prometheus-data:
  grafana-data:
